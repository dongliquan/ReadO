# Pushing a tag like v0.1.0 builds reado.exe and attaches it to a DRAFT release; review it, then press Publish.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: bash .github/ci-step.sh "pip install" pip install -r requirements.txt
        shell: bash
      - run: bash .github/ci-step.sh "fetch vendor assets" python fetch-vendor.py
        shell: bash
      - run: bash .github/ci-step.sh "build reado.exe" cmd //c build.bat
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: reado-windows
          path: dist/reado.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
